pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,json,jsonc,css,html,svelte}"
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: typecheck
      run: bun run check

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}
